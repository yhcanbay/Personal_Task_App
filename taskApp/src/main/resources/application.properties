spring.application.name=taskApp
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=task_app}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${APP_DB_SCHEMA:task_app}

spring.output.ansi.enabled=ALWAYS
spring.datasource.hikari.schema=${APP_DB_SCHEMA:task_app}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql


# Frontend aktivasyon base URL'i (linkte kullanılacak)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
