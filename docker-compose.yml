services:
  db:
    image: postgres:16-alpine
    container_name: taskapp-db
    environment:
      POSTGRES_DB: taskapp
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: taskapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskapp -d taskapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./taskApp
      dockerfile: Dockerfile
    container_name: taskapp-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/taskapp
      SPRING_DATASOURCE_USERNAME: taskapp
      SPRING_DATASOURCE_PASSWORD: taskapp
      APP_FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./taskApp/frontend/Ders_Programi
      dockerfile: Dockerfile
    container_name: taskapp-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
